name: Build and deploy PHP app to Azure Web App - vmsapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, intl, pdo_mysql
          tools: composer

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B185C22A49E6492687361AD0FD27FF9B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7ADC5F239CFE4A9AA2B65BFF64B1782D }}
          subscription-id: 950beaa0-bf15-4a26-9b08-5adcdd0e4def

      - name: Verify Azure App Service
        run: |
          az account show --query "{name:name, subscriptionId:id}" -o table

          az webapp show \
            --name vmsapp \
            --resource-group vmsapp_group \
            --query "{name:name, state:state, hostNames:hostNames}" \
            -o table

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: vmsapp
          resource-group-name: vmsapp_group
          slot-name: Production
          package: .
